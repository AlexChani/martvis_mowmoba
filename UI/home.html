<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      background-color: rgb(218, 218, 218);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }
    
    #sidebar {
      box-sizing: border-box;
      width: 16%;
      min-width: 180px;
      max-width: 24%;
      background-color: #0353A4;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    
    #top {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex-grow: 1;
      gap: 1rem;
    }
    
    #icon {
      max-width: 100%;
      height: auto;
      margin-bottom: 1rem;
    }
    
    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
      color: white;
      margin-bottom: 20%;
    }
    
    .button {
      background-color: rgb(218, 218, 218);
      font-size: 1.25rem;
      padding: 1rem 1rem ;
      display: inline-block;
      text-decoration: none;
      color: black;
      border-radius: 10px;
      width: auto;
      min-width: 120px;
      min-height: 50px;
      text-align: center;
      box-sizing: border-box;
      margin-top: 3rem;
    }
    
    button {
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      background-color: transparent;
    }
    
    #sidebar > a:last-child {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }
    
    #exitimg {
      max-width: 100px;
      height: auto;
      display: block;
    }
   
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="top">
      <a href="home.html"><img id="icon" src="https://cdn.discordapp.com/attachments/883277359669735514/1389351496663171152/76bb6914-f45e-4d20-8d37-2099035ac9e4.png?ex=68644de9&is=6862fc69&hm=5534db808bd468fd9cdf45b555aa14af408409132178a821a3bc07b756c38101&" alt="icon"></a>
      <h1>Welcome, {{username}}</h1>
      <a href="about.html" class="button">Quick Test</a>
      <a href="about.html" class="button">Practice</a>
      <a href="about.html" class="button">Stats</a>
      <a href="about.html" class="button">Driving Schools</a>
    </div>

    <!-- <a href="pycall:run_button_action"><button>Click Me (Run Python)</button></a> -->
    <a href="pycall:run_button_action"><button><img id="exitimg" src="https://icons.veryicon.com/png/o/object/material-design-icons/exit-to-app.png" alt="exit"></button></a>
  </div>
</body>
</html>
