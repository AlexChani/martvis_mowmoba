<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      font-weight: 600;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    #sidebar {
      box-sizing: border-box;
      width: 16%;
      min-width: 180px;
      max-width: 24%;
      background-color: #1f1f1f;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: start;
      height: 100vh;
      border-right: rgba(255, 255, 255, 0.644) 1px solid;
      padding-bottom: 3%;
    }

    #top {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-grow: 1;
    }

    #icon {
      padding-top: 0.45rem;
      padding-left: 0.9rem;
      max-width: 30%;
      height: auto;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
      color: white;
      margin-bottom: 20%;
    }

    .button {
      background-color: transparent;
      font-size: 1.25rem;
      padding: 1rem 1.7rem;
      display: inline-block;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.644);
      width: 100%;
      min-height: 50px;
      text-align: left;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .button:hover {
      color: white;
      background-color: rgba(255, 255, 255, 0.137);
    }

    button {
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      background-color: transparent;
    }

    #sidebar > a:last-child {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    #exitimg {
      max-width: 100px;
      height: auto;
      display: block;
    }

    #selected {
      color: white;
    }

    #main-content {
      flex-grow: 1;
      color: #fff;
      background: linear-gradient(to bottom, #4b4b4b 0%, #1f1f1f 25%);
      padding-bottom: 7rem;
    }

        main {
      display: grid;
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem;
      align-items: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      background-color: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .card:hover {
      box-shadow: 2px 2px 30px black;
    }

    #disabledcontinue {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
      background-color: rgba(255, 255, 255, 0.041);
      color: grey;
    }

    #disabledcontinue h2, #disabledcontinue p {
      color: grey;
    }

    #disabledcontinue:hover {
      box-shadow: none;
    }

    .row {
      display: flex;
      width: 100%;
      justify-content: space-around;
    }

    .cardlink {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
    }

    .cardlink:hover{
      background-color: #ffffff3a;
    }

    .cardlink img {
      position: fixed;
      opacity: 0;
      width: 200px;
      height: 200px;
      transition: all 0.3s ease;
    }

    .cardlink img:hover {
      opacity: 1;
      width: 350px;
      height: 350px;
    }

    .card p, .card h2 {
      color: white;
    }

    a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="top">
      <img id="icon" src="https://cdn.discordapp.com/attachments/883277359669735514/1389617266894835855/2.png?ex=68673fae&is=6865ee2e&hm=a40fc387a7697918282ee3c0677f0097205e2e6d14ebc551e6de8d608c81d4fe&" alt="icon">
      <a href="file:///home.html" class="button">Home</a>
      <a href="file:///practice.html" class="button">Practice</a>
      <a href="file:///stats.html" class="button">Stats</a>
      <a href="file:///schoolsmap.html" class="button">Driving Schools</a>
    </div>
  </div>

  <div id="main-content">
    <main>
      <div class="row">
        <div class="card">
          <a class="cardlink" href="file:///roadsigns.html">
            <h2>
              Roadsigns
            </h2>
            <img src="https://cdn.discordapp.com/attachments/883277359669735514/1389916431893794947/Untitled.png?ex=68665c0c&is=68650a8c&hm=241ec5b9cf2c5f8ad74148f9f8a28ace8cb152afd377f05fdbd6af2f24959bc0&" alt="start">
          </a>
        </div>
        <div class="card">
          <a class="cardlink" href="file:///regulator.html">
            <h2>
              Regulator Signals
            </h2>
            <img src="https://cdn.discordapp.com/attachments/883277359669735514/1389916431893794947/Untitled.png?ex=68665c0c&is=68650a8c&hm=241ec5b9cf2c5f8ad74148f9f8a28ace8cb152afd377f05fdbd6af2f24959bc0&" alt="start">
          </a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
