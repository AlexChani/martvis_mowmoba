<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: sans-serif;
      font-weight: 600;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    #sidebar {
      box-sizing: border-box;
      width: 16%;
      min-width: 180px;
      max-width: 24%;
      background-color: #1f1f1f;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: start;
      height: 100vh;
      border-right: #ffb83b 1px solid;
      padding-bottom: 3%;
    }

    #top {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-grow: 1;
    }

    #icon {
      padding-top: 0.45rem;
      padding-left: 0.9rem;
      max-width: 30%;
      height: auto;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
      color: white;
      margin-bottom: 20%;
    }

    h2 {
      text-align: center;
    }

    .button {
      background-color: transparent;
      font-size: 1.25rem;
      padding: 1rem 1.7rem;
      display: inline-block;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.644);
      width: 100%;
      min-height: 50px;
      text-align: left;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .button:hover {
      color: rgb(0, 0, 0);
      background-color: #ffb83b;
    }

    button {
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      background-color: transparent;
    }

    #sidebar > a:last-child {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    #exitimg {
      max-width: 100px;
      height: auto;
      display: block;
    }

    #selected {
      color: rgb(0, 0, 0);
      background-color: #ffb83b;
    }

    #main-content {
      flex-grow: 1;
      color: #fff;
      background: linear-gradient(to bottom, #4b4b4b 0%, #1f1f1f 25%);
      padding-bottom: 7rem;
    }

    main {
      display: grid;
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem;
      align-items: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      background-color: rgba(255, 255, 255, 0.1);
      transition: box-shadow 0.18s ease;
    }

    #disabledcontinue {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
      background-color: rgba(255, 255, 255, 0.041);
      color: grey;
    }

    #disabledcontinue h2, #disabledcontinue p {
      color: grey;
    }

    #disabledcontinue:hover {
      box-shadow: none;
    }

    .row {
      display: flex;
      width: 100%;
      justify-content: space-around;
    }

    .cardlink {
      position: relative;
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      background-color: transparent;
      transition: none;
      flex-direction: column;
    }

    .cardnonlink {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
    }

    .card p, .card h2 {
      color: white;
    }

    a {
      text-decoration: none;
    }

    h3 {
      color: white;
      text-align: center;
      font-size: large;
      text-decoration: underline;
    }
  </style>
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <div id="sidebar">
    <div id="top">
      <img id="icon" src="Images/brand-logo.png" alt="App logo">
      <a href="home.html" class="button">Home</a>
      <a href="practice.html" class="button">Practice</a>
      <a href="stats.html" class="button" id="selected">Stats</a>
      <a href="schoolsmap.html" class="button">Driving Schools</a>
    </div>
  </div>

  <div id="main-content">
    <main>
      <div class="row">
        <div class="card">
          <a class="cardnonlink">
            <h2>
              Theme to practice
            </h2>
            <p>
              (Theme with most mistakes)
            </p>
            <h3>
              {{focus_theme}}
            </h3>
          </a>
        </div>

        <div class="card">
          <a class="cardlink has-play-icon" href="mistake_questions.html">
            <h2>See all the questions you answered wrong</h2>
            <img class="play-icon" src="Images/play-icon.png" alt="start">
          </a>
        </div>
      </div>
    </main>
  </div>
  <script>
    document.querySelectorAll('.cardlink.has-play-icon').forEach(link => {
      link.addEventListener('pointerenter', () => link.classList.add('hovered'));
      link.addEventListener('pointerleave', () => link.classList.remove('hovered'));
    });
  </script>
</body>
</html>
