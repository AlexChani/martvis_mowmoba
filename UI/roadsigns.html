<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      font-weight: 600;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    #sidebar {
      box-sizing: border-box;
      width: 16%;
      min-width: 225px;
      max-width: 24%;
      background-color: #1f1f1f;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: start;
      height: 100vh;
      border-right: rgba(255, 255, 255, 0.644) 1px solid;
      padding-bottom: 3%;
    }

    #top {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-grow: 1;
    }

    #icon {
      padding-top: 0.45rem;
      padding-left: 0.9rem;
      max-width: 30%;
      height: auto;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
      color: white;
      margin-bottom: 20%;
    }

    .button {
      background-color: transparent;
      font-size: 1.25rem;
      padding: 1rem 1.7rem;
      display: inline-block;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.644);
      width: 100%;
      min-height: 50px;
      text-align: left;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .button:hover {
      color: white;
      background-color: rgba(255, 255, 255, 0.137);
    }

    button {
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      background-color: transparent;
    }

    #sidebar > a:last-child {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    #exitimg {
      max-width: 100px;
      height: auto;
      display: block;
    }

    #selected {
      color: white;
    }

    #main-content {
      flex-grow: 1;
      color: #fff;
      background: linear-gradient(to bottom, #4b4b4b 0%, #1f1f1f 25%);
      padding-bottom: 7rem;
    }

    main {
      justify-content: center;
      display: flex;
      flex-wrap: wrap;
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem;
      align-items: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      transition: all 0.3s ease;
    }

    #disabledcontinue {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
      background-color: rgba(255, 255, 255, 0.041);
      color: grey;
    }

    #disabledcontinue h2, #disabledcontinue p {
      color: grey;
    }

    #disabledcontinue:hover {
      box-shadow: none;
    }

    .cardlink {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
    }

    .cardlink img {
      position: fixed;
      width: 210px;
      height: 210px;
      transition: all 0.3s ease;
    }

    .cardlink img:hover {
      width: 250px;
      height: 250px;
      filter: drop-shadow(6px 6px 8px rgb(0, 0, 0));
    }

    .card p, .card h2 {
      color: white;
    }

    a {
      text-decoration: none;
    }

    h2{
      pointer-events: none;
      z-index: 1;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    }

    .bbutton {
      background-color: transparent;
      font-size: 1.25rem;
      padding: 15px;
      display: inline-block;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.644);
      width: fit-content;
      min-height: 50px;
      text-align: center;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .bbutton:hover {
      color: white;
      background-color: rgba(255, 255, 255, 0.137);
    }

  </style>
</head>
<body>
  <div id="sidebar">
    <div id="top">
      <img id="icon" src="https://cdn.discordapp.com/attachments/883277359669735514/1389617266894835855/2.png?ex=68673fae&is=6865ee2e&hm=a40fc387a7697918282ee3c0677f0097205e2e6d14ebc551e6de8d608c81d4fe&" alt="icon">
      <a href="file:///home.html" class="button">Home</a>
      <a href="file:///practice.html" class="button">Practice</a>
      <a href="file:///stats.html" class="button">Stats</a>
      <a href="file:///schoolsmap.html" class="button">Driving Schools</a>
    </div>
  </div>

  <div id="main-content">
    <a href="file:///info.html" class="bbutton">Back</a>
    <main>
        <div class="card">
          <a class="cardlink" href="file:///warning.html">
            <img src="https://teoria.on.ge/image/signs/sign-icon-1.svg" alt="start">
            <h2>
              Warning
            </h2>
          </a>
        </div>
        <div class="card">
          <a class="cardlink" href="file:///priority.html">
            <img src="https://teoria.on.ge/image/signs/sign-icon-2.svg" alt="start">
            <h2>
              Priority
            </h2>
          </a>
        </div>
        <div class="card">
          <a class="cardlink" href="file:///prohibitive.html">
            <img src="https://teoria.on.ge/image/signs/sign-icon-3.svg" alt="start">
            <h2>
              Prohibitive
            </h2>
          </a>
        </div>
        <div class="card">
          <a class="cardlink" href="file:///indicative.html">
            <img src="https://teoria.on.ge/image/signs/sign-icon-4.svg" alt="start">
            <h2>
              Indicative
            </h2>
          </a>
        </div>
        <div class="card">
          <a class="cardlink" href="file:///special.html">
            <img src="https://teoria.on.ge/image/signs/sign-icon-5.svg" alt="start">
            <h2>
              Special Instructions
            </h2>
          </a>
        </div>
        <div class="card">
          <a class="cardlink" href="file:///service.html">
            <img src="https://teoria.on.ge/image/signs/sign-icon-6.svg" alt="start">
            <h2>
              Service
            </h2>
          </a>
        </div>
        <div class="card">
          <a class="cardlink" href="file:///information.html">
            <img src="https://teoria.on.ge/image/signs/sign-icon-7.svg" alt="start">
            <h2>
              Information
            </h2>
          </a>
        </div>
        <div class="card">
          <a class="cardlink" href="file:///addinformation.html">
            <img src="https://teoria.on.ge/image/signs/sign-icon-8.svg" alt="start">
            <h2>
              Additional Information
            </h2>
          </a>
        </div>
        <div class="card">
          <a class="cardlink" href="file:///markings.html">
            <img src="https://teoria.on.ge/image/signs/sign-icon-101.svg" alt="start">
            <h2>
              Road markings
            </h2>
          </a>
        </div>
    </main>
  </div>
</body>
</html>
