<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      font-weight: 600;
    }
    
    #sidebar {
      width: 16%;
      min-width: 225px;
      max-width: 24%;
      background-color: #1f1f1f;
      display: flex;
      flex-direction: column;
      border-right: #ffb83b 1px solid;
    }

    #top {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-grow: 1;
    }

    #icon {
      padding-top: 0.45rem;
      padding-left: 0.9rem;
      max-width: 30%;
      height: auto;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
      color: white;
      margin-bottom: 20%;
    }

    .button {
      background-color: transparent;
      font-size: 1.25rem;
      padding: 1rem 1.7rem;
      display: inline-block;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.644);
      width: 100%;
      min-height: 50px;
      text-align: left;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .button:hover {
      color: rgb(0, 0, 0);
      background-color: #ffb83b;
    }

    button {
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      background-color: transparent;
    }

    #sidebar > a:last-child {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    #exitimg {
      max-width: 100px;
      height: auto;
      display: block;
    }

    #selected {
      color: rgb(0, 0, 0);
      background-color: #ffb83b;
    }

    #main-content {
      flex-grow: 1;
      color: #fff;
      background: transparent;
      padding-bottom: 7rem;
    }

    body {
      background-color: #1f1f1f;
      background-image: linear-gradient(to bottom, #4b4b4b 0%, #1f1f1f 25%);
      background-size: 100% 100vh;
      background-repeat: no-repeat;
    }

    main {
      display: grid;
      height: 100%;
      padding: 1.5rem;
      align-items: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      background-color: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .card:hover {
      box-shadow: 2px 2px 30px black;
    }

    #disabledcontinue {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
      background-color: rgba(255, 255, 255, 0.041);
      color: grey;
    }

    #disabledcontinue h2, #disabledcontinue p {
      color: grey;
    }

    #disabledcontinue:hover {
      box-shadow: none;
    }

    .row {
      display: flex;
      width: 100%;
      justify-content: space-around;
    }

    .cardlink {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
    }

    .cardlink:hover{
      background-color: #ffffff3a;
    }

    .cardlink img {
      position: fixed;
      opacity: 0;
      width: 200px;
      height: 200px;
      transition: all 0.3s ease;
    }

    .cardlink img:hover {
      opacity: 1;
      width: 350px;
      height: 350px;
    }

    .card p, .card h2 {
      color: white;
    }

    a {
      text-decoration: none;
    }

    table {
     width: 100%; border-collapse: collapse; margin-top: 20px;
    }
    th, td { 
    border: 1px solid #cccccc; padding: 8px;
    }
    .wrong-questions-table th,
    .wrong-questions-table td { background: transparent; }
  </style>
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <div id="sidebar">
    <div id="top">
      <img id="icon" src="Images/brand-logo.png" alt="App logo">
      <a href="home.html" class="button">Home</a>
      <a href="practice.html" class="button">Practice</a>
      <a href="stats.html" class="button" id="selected">Stats</a>
      <a href="schoolsmap.html" class="button">Driving Schools</a>
    </div>
  </div>

  <div id="main-content">
    <main>
        <h2>Wrong Questions</h2>
        {{wrong_questions_table}}
    </main>
  </div>
</body>
</html>
