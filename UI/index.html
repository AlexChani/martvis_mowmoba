<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: sans-serif;
      font-weight: 600;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    #icon {
      max-width: 30%;
      height: auto;
    }

    .button {
      background-color: transparent;
      font-size: 1.25rem;
      padding: 1rem 1.7rem;
      display: inline-block;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.644);
      width: 100%;
      min-height: 50px;
      text-align: center;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .button:hover {
      color: rgb(0, 0, 0);
      background-color: #ffb83b;
    }

    button {
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      background-color: transparent;
    }

    #main-content {
      flex-grow: 1;
      color: #fff;
      background: linear-gradient(to bottom, #4b4b4b 0%, #1f1f1f 25%);
      padding-bottom: 7rem;
    }

    main {
      align-items: center;
      justify-content: center;
      display: flex;
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem;
    }

    #signin {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 30%;
      background-color: #303030;
      border-radius: 10px;
      border: #ffb83b 1px solid;
    }

    input, select{
      margin: 10%;
      width: 60%;
      height: 3vh;
      background-color: rgb(26, 26, 26);
      outline: none;
      border: rgba(255, 255, 255, 0.452) solid 1px;
      border-radius: 1px;
      color: white;
      font-size: large;
      text-align: center;
    }
  </style>
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <div id="main-content">
    <main>
         <form onsubmit="return validateForm()" id="signin">
            <img id="icon" src="Images/brand-logo.png" alt="App logo">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Your name" maxlength="20" required><br><br>
            <label for="category">Category:</label>
            <select id="category" required>
              <option value="">-- Choose a category --</option>
              <option value="A">A</option>
              <option value="AM">AM</option>
              <option value="B">B</option>
              <option value="B+C1_Mil">B+C1 Mil</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="T">T</option>
              <option value="Tram">Tram</option>
            </select><br><br>
        
            <button class="button" type="submit">Submit</button>
         </form>
    </main>
  </div>

  <script>
    function validateForm() {
    const name = document.getElementById("name").value.trim();
    const category = document.getElementById("category").value;

    if (name === "" || category === "") {
      alert("Please enter your name and select a category.");
      return false;
    }
  
    window.location.href = `pycall:/submit_name?name=${name}&category=${category}`

    return false;
    }
  </script>
</body>
</html>
