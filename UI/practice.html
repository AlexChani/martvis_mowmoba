<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      font-weight: 600;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    #sidebar {
      box-sizing: border-box;
      width: 16%;
      min-width: 180px;
      max-width: 24%;
      background-color: #1f1f1f;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: start;
      height: 100vh;
      border-right: #ffb83b 1px solid;
      padding-bottom: 3%;
    }

    #top {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-grow: 1;
    }

    #icon {
      padding-top: 0.45rem;
      padding-left: 0.9rem;
      max-width: 30%;
      height: auto;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
      color: white;
      margin-bottom: 20%;
    }

    .button {
      background-color: transparent;
      font-size: 1.25rem;
      padding: 1rem 1.7rem;
      display: inline-block;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.644);
      width: 100%;
      min-height: 50px;
      text-align: left;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .button:hover {
      color: rgb(0, 0, 0);
      background-color: #ffb83b;
    }

    button {
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      background-color: transparent;
    }

    #sidebar > a:last-child {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    #exitimg {
      max-width: 100px;
      height: auto;
      display: block;
    }

    #selected {
      color: rgb(0, 0, 0);
      background-color: #ffb83b;
    }

    #main-content {
      flex-grow: 1;
      color: #fff;
      background: linear-gradient(to bottom, #4b4b4b 0%, #1f1f1f 25%);
      padding-bottom: 7rem;
    }

    main {
      display: grid;
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem;
      align-items: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      background-color: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .card:hover {
      box-shadow: 2px 2px 30px black;
    }

    #disabledcontinue {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
      background-color: rgba(255, 255, 255, 0.041);
      color: grey;
    }

    #disabledcontinue h2, #disabledcontinue p {
      color: grey;
    }

    #disabledcontinue:hover {
      box-shadow: none;
    }

    .row {
      display: flex;
      width: 100%;
      justify-content: space-around;
    }

    .cardlink {
      overflow: clip;
      padding: 0;
      width: 350px;
      height: 275px;
      min-width: 200px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      transition: all 0.3s ease;
      flex-direction: column;
    }

    .cardlink:hover{
      background-color: #ffffff3a;
    }

    .cardlink img {
      position: fixed;
      opacity: 0;
      width: 200px;
      height: 200px;
      transition: all 0.3s ease;
    }

    .cardlink img:hover {
      opacity: 1;
      width: 350px;
      height: 350px;
    }

    .card p, .card h2 {
      color: white;
    }

    a {
      text-decoration: none;
    }







    svg{
      color: white;
      cursor:pointer;
      position: fixed;
      overflow: show;
      margin: auto;
      height: auto;
    }
    
    
    svg:hover{ 
        -webkit-animation-name: spin;
        -webkit-animation-duration: 1000ms;
        -webkit-animation-iteration-count: 1;
    }
    
    
    
    @-ms-keyframes spin {
        from { -ms-transform: rotate(0deg); }
        to { -ms-transform: rotate(360deg); }
    }
    @-moz-keyframes spin {
        from { -moz-transform: rotate(0deg); }
        to { -moz-transform: rotate(360deg); }
    }
    @-webkit-keyframes spin {
        from { -webkit-transform: rotate(0deg); }
        to { -webkit-transform: rotate(360deg); }
    }
    @keyframes spin {
        from {
            transform:rotate(0deg);
        }
        to {
            transform:rotate(360deg);
        }
    }



    #refresh{
      margin-left: 96%;
      margin-top: 2%;
    }

    .tooltip {
      position: absolute;
      top: -20px;
      left: 0;
      display: none;
      background: black;
      color: white;
      padding: 2px 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="top">
      <img id="icon" src="https://i.imgur.com/uIkW4X5.png" alt="icon">
      <a href="file:///home.html" class="button">Home</a>
      <a href="file:///practice.html" class="button" id="selected">Practice</a>
      <a href="file:///stats.html" class="button">Stats</a>
      <a href="file:///schoolsmap.html" class="button">Driving Schools</a>
    </div>
  </div>

  <div id="main-content">
    <a href="pycall:update" id="refresh">
      <svg fill="#FFFFFF" height="48" viewBox="0 0 24 24" width="48" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          <path d="M0 0h24v24H0z" fill="none"/>
      </svg>
      <div class="tooltip">Tooltip text</div>
    </a>
    <main>
      <div class="row">
        <div class="card">
          <a class="cardlink" href="file:///quiz_random.html">
            <h2>
              Quiz Mode
            </h2>
            <p>
              30 questions, 30 minutes, 3 mistakes
            </p>
            <p>
              Theory test imitation
            </p>
            <img src="https://i.imgur.com/wNf9V5Z.png" alt="start">
          </a>
        </div>

        <div class="card">
          <a class="cardlink" href="file:///quiz_sequential.html">
            <h2>Training Mode</h2>
            <p>Test with every question in the category</p>
            <img src="https://i.imgur.com/wNf9V5Z.png" alt="start">
          </a>
        </div>
      </div>
      <div class="row">
        <div class="card">
          <a class="cardlink" href="file:///info.html">
            <h2>
              Info
            </h2>
            <p>
              Get basic info about driving theory
            </p>
            <img src="https://i.imgur.com/wNf9V5Z.png" alt="start">
          </a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
