<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: sans-serif;
      font-weight: 600;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    #sidebar {
      box-sizing: border-box;
      width: 16%;
      min-width: 180px;
      max-width: 24%;
      background-color: #1f1f1f;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: start;
      height: 100vh;
      border-right: #ffb83b 1px solid;
      padding-bottom: 3%;
    }

    #top {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-grow: 1;
    }

    #icon {
      padding-top: 0.45rem;
      padding-left: 0.9rem;
      max-width: 30%;
      height: auto;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      text-align: center;
      color: white;
      margin-bottom: 1rem;
    }

    .button {
      background-color: transparent;
      font-size: 1.25rem;
      padding: 1rem 1.7rem;
      display: inline-block;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.644);
      width: 100%;
      min-height: 50px;
      text-align: left;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .button:hover {
      color: rgb(0, 0, 0);
      background-color: #ffb83b;
    }

    button {
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      background-color: transparent;
    }

    #sidebar > a:last-child {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    #exitimg {
      max-width: 100px;
      height: auto;
      display: block;
    }

    #selected {
      color: rgb(0, 0, 0);
      background-color: #ffb83b;
    }

    #main-content {
      flex-grow: 1;
      color: #fff;
      background: linear-gradient(to bottom, #4b4b4b 0%, #1f1f1f 25%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2.5rem 3.5rem;
      border-radius: 18px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 300px;
      max-width: 500px;
    }

    .result {
      font-size: 1.2rem;
      margin-bottom: 0.75rem;
    }

    .card a {
      margin-top: 2rem;
      font-size: 1rem;
      background-color: #3a3a3a;
      padding: 0.75rem 2rem;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .card a:hover {
      background-color: #5a5a5a;
    }
  </style>
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <div id="sidebar">
    <div id="top">
      <img id="icon" src="Images/brand-logo.png" alt="App logo">
      <a href="home.html" class="button" id="selected">Home</a>
      <a href="practice.html" class="button">Practice</a>
      <a href="stats.html" class="button">Stats</a>
      <a href="schoolsmap.html" class="button">Driving Schools</a>
    </div>
  </div>

  <div id="main-content">
    <div class="card">
      <h1>Test Over!</h1>
      <div class="result">Score: <b>{{score}}</b> / {{total}}</div>
      <div class="result">Mistakes: <b>{{mistakes}}</b></div>
      <div class="result">Result: <b>{{result_text}}</b></div>
      <a href="home.html">Return to Home</a>
    </div>
  </div>
</body>
</html>
