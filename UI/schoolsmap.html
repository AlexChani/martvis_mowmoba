<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      font-weight: 600;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    #sidebar {
      box-sizing: border-box;
      width: 16%;
      min-width: 180px;
      max-width: 24%;
      background-color: #1f1f1f;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: start;
      height: 100vh;
      border-right: rgba(255, 255, 255, 0.644) 1px solid;
      padding-bottom: 3%;
    }

    #top {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-grow: 1;
    }

    #icon {
      padding-top: 0.45rem;
      padding-left: 0.9rem;
      max-width: 30%;
      height: auto;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      text-align: center;
      color: white;
      margin-bottom: 20%;
    }

    .button {
      background-color: transparent;
      font-size: 1.25rem;
      padding: 1rem 1.7rem;
      display: inline-block;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.644);
      width: 100%;
      min-height: 50px;
      text-align: left;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .button:hover {
      color: white;
      background-color: rgba(255, 255, 255, 0.137);
    }

    button {
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      background-color: transparent;
    }

    #sidebar > a:last-child {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    #exitimg {
      max-width: 100px;
      height: auto;
      display: block;
    }

    #selected {
      color: white;
    }

    #main-content {
      flex-grow: 1;
      color: #fff;
      background: linear-gradient(to bottom, #4b4b4b 0%, #1f1f1f 25%);
      padding-bottom: 3rem;
    }

    main {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      padding: 1.5rem;
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>
<body>
  <div id="sidebar">
    <div id="top">
      <img id="icon" src="https://cdn.discordapp.com/attachments/883277359669735514/1389617266894835855/2.png?ex=68673fae&is=6865ee2e&hm=a40fc387a7697918282ee3c0677f0097205e2e6d14ebc551e6de8d608c81d4fe&" alt="icon">
      <a href="file:///home.html" class="button">Home</a>
      <a href="file:///practice.html" class="button">Practice</a>
      <a href="file:///stats.html" class="button">Stats</a>
      <a href="file:///schoolsmap.html" class="button" id="selected">Driving Schools</a>
    </div>
  </div>

  <div id="main-content">
    <main>
        <div id="map" style="height: 100%; width: 100%;"></div>
    </main>
  </div>

<script>
    const map = L.map('map').setView([41.7151, 44.8271], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const schools = {{school_data}};

    schools.forEach(school => {
      const marker = L.marker([school.lat, school.lon]).addTo(map);
      let content = `<b>${school.name}</b><br>${school.address}<br>${school.phone}`;
      if (school.website) {
        // content += `<br><a href="${school.website}" target="_blank">Website</a>`;
        content += `<br>Website: ${school.website}`;
      }
      marker.bindPopup(content);
    });
  </script>
</body>
</html>
